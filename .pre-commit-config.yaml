repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format
        types: [ python ]
      - id: ruff-check
        name: ruff-check
        language: system
        entry: ruff check
        types: [ python ]
  - repo: local
    hooks:
      - id: isort
        name: isort
        language: system
        entry: isort
        types: [python]

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        language: system
        entry: flake8
        types: [ python ]
        args: [--max-line-length=120]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: mypy
        types: [ python ]

