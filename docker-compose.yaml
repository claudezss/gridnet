version: '3.7'

services:
  minio1:
    image: quay.io/minio/minio
    hostname: minio1
    volumes:
      - F:\\Data\\minio\\data1:/data1
      - G:\\Data\\minio\\data2:/data2
    ports:
      - 9010:9000
      - 9011:9001
    environment:
      MINIO_ROOT_USER: claude
      MINIO_ROOT_PASSWORD: z1994y1116
    command: server --console-address ":9001" http://minio{1...2}/data{1...2}
    networks:
      - minio_distributed

  minio2:
    image: quay.io/minio/minio
    hostname: minio2
    volumes:
      - F:\\Data\\minio\\data3:/data1
      - G:\\Data\\minio\\data4:/data2
    ports:
      - 9020:9000
      - 9021:9002
    environment:
      MINIO_ROOT_USER: claude
      MINIO_ROOT_PASSWORD: z1994y1116
    command: server --console-address ":9002" http://minio{1...2}/data{1...2}
    networks:
      - minio_distributed

networks:
  minio_distributed:
